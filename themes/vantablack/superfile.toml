##############################################
#                                            #
#              Vantablack Theme              #
#                                            #
##############################################

# Built from Desk's vantablack palette (/usr/share/desk/themes/vantablack/colors.toml).
# See https://superfile.dev/configure/custom-theme/

code_syntax_highlight = "bw"

#-- Full Screen
full_screen_fg = "#ececec"
full_screen_bg = "#000000"

#-- Gradient
gradient_color = ["#8d8d8d", "#ececec"]

#-- File Panel
file_panel_fg = "#b0b0b0"
file_panel_bg = "#000000"
file_panel_border = "#505050"
file_panel_border_active = "#ececec"
file_panel_top_directory_icon = "#cecece"
file_panel_top_path = "#ececec"
file_panel_item_selected_fg = "#ffffff"
file_panel_item_selected_bg = "#1a1a1a"

#-- Footer
footer_fg = "#b0b0b0"
footer_bg = "#000000"
footer_border = "#505050"
footer_border_active = "#ececec"

#-- Sidebar
sidebar_fg = "#b0b0b0"
sidebar_bg = "#000000"
sidebar_title = "#ececec"
sidebar_border = "#000000"
sidebar_border_active = "#ececec"
sidebar_item_selected_fg = "#ffffff"
sidebar_item_selected_bg = "#1a1a1a"
sidebar_divider = "#505050"

#-- Modals
modal_fg = "#ececec"
modal_bg = "#090909"
modal_border_active = "#8d8d8d"
modal_cancel_fg = "#000000"
modal_cancel_bg = "#7a7a7a"
modal_confirm_fg = "#000000"
modal_confirm_bg = "#ececec"

#-- Help Menu
help_menu_hotkey = "#ececec"
help_menu_title = "#8d8d8d"

#-- Special
cursor = "#ffffff"
correct = "#b6b6b6"
error = "#a4a4a4"
hint = "#8d8d8d"
cancel = "#7a7a7a"
