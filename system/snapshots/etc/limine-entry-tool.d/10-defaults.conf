# Boot entries are managed by limine-entry-tool, not by hand.
TARGET_OS_NAME="Arch Linux"
ESP_PATH="/boot"
# Keep the removable EFI path current, in case firmware loses the boot entry.
ENABLE_LIMINE_FALLBACK=yes
# Otherwise the menu gets an entry for the fallback path, which is just Limine again.
FIND_BOOTLOADERS=no
# The upstream docs recommend a 4 GiB ESP. A 2 GiB one stays safe with this cap,
# and limine-snapper-sync also stops adding entries at 85% ESP usage.
MAX_SNAPSHOT_ENTRIES=6
