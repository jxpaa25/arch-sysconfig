# Network: modern congestion control, and MTU probing for awkward links such as VPNs.
net.ipv4.tcp_mtu_probing=1
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr

# Memory: zram swap is cheap, so prefer it over dropping file cache.
vm.swappiness=150
vm.page-cluster=0
vm.watermark_boost_factor=0
vm.watermark_scale_factor=125
vm.vfs_cache_pressure=50

# Writeback: flush early and in small amounts, to avoid long stalls on big writes.
vm.dirty_background_bytes=67108864
vm.dirty_bytes=268435456
vm.dirty_writeback_centisecs=1500
